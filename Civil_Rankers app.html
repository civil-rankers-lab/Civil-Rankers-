/* Civil Rankers 2026: pixel-directed responsive enhancement; existing CBT selectors preserved */
:root{--blue:#224eff;--ink:#0b1d55;--line:#dbe4fc;--muted:#566b9f;--shadow:0 12px 34px rgba(38,67,165,.055)}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#0d2059}
.cr-ico{width:22px;height:22px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
.cr-ico.sm{width:18px;height:18px}.cr-ico.lg{width:28px;height:28px}
.brand{font-size:16px;color:#0b205d;letter-spacing:.025em;gap:12px}.brand-logo{padding:0;overflow:hidden;background:linear-gradient(130deg,#2656ff,#695aff);border-radius:14px;box-shadow:0 9px 20px #3451ef25;flex-shrink:0}.brand-logo img{width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit}.brand small{font-weight:850;letter-spacing:.16em;opacity:.64;font-size:9px}
.btn{border-radius:12px;background:linear-gradient(100deg,#2946f9,#1674fc);box-shadow:0 6px 12px #2153e813;transition:background .18s,box-shadow .18s,transform .18s}.btn.line{border-color:#cbdcff}.btn.ghost{background:#edf1ff}.btn:hover:not(:disabled){box-shadow:0 9px 24px #234ee62b}.eyebrow{font-size:11px;letter-spacing:.22em;color:#7fa9ff}.page-title{font-size:29px;color:#0b1d56;letter-spacing:-.036em}.lead{color:#50649e;font-size:14px;line-height:1.35}.panel,.card{border:1px solid #dfe6fb;box-shadow:0 10px 28px #1b47ae09}.panel{border-radius:19px;padding:22px}.card{border-radius:20px}
/* LANDING VIEW: original reference composition */
.welcome{position:relative;overflow:hidden;min-height:100vh;background:radial-gradient(circle at 69% 4%,#156cd2 0%,transparent 42%),radial-gradient(circle at 24% 115%,#19469c 0%,transparent 47%),linear-gradient(112deg,#03102d 0%,#061d56 47%,#04377c 100%);padding:0;color:#fff;display:block}.welcome:after{content:"";position:absolute;inset:auto 0 0;height:24%;background:linear-gradient(0deg,rgba(1,10,37,.6),transparent);pointer-events:none}.welcome-inner{max-width:none;width:100%;min-height:100vh;padding:clamp(34px,5.6vw,98px) clamp(26px,6.4vw,110px);position:relative;z-index:1;display:flex;flex-direction:column}.welcome-head{justify-content:flex-start}.welcome .brand{font-size:24px;color:#fff;letter-spacing:.02em}.welcome .brand small{font-size:14px;letter-spacing:.23em;opacity:.9}.welcome .brand-logo{width:152px;height:152px;border-radius:50%;box-shadow:none;background:none}.welcome-hero{display:flex;align-items:center;flex:1;position:relative;z-index:2;grid-template-columns:none;gap:0;padding:45px 0 0}.welcome-copy{position:relative;z-index:3;max-width:860px}.welcome-copy .eyebrow{letter-spacing:.28em;font-size:13px;color:#6baaff}.welcome-copy .eyebrow b{color:#f1b636}.welcome-hero h1{max-width:860px;font-size:clamp(47px,5.4vw,87px);letter-spacing:-.056em;line-height:1.08;margin:24px 0}.welcome-hero h1 em{font-style:normal;color:#9dc4ff;display:block}.welcome-hero p{max-width:760px;font-size:clamp(16px,1.42vw,23px);color:#e5e9ff;line-height:1.58;letter-spacing:-.01em}.welcome-hero .actions{gap:18px;margin-top:39px}.welcome-hero .btn{min-height:72px;padding:18px 33px;font-size:18px;border-radius:14px}.welcome .btn.line{border:2px solid #568bdf;background:#0a1b49c0}.welcome-art{position:absolute;top:0;bottom:0;right:0;width:57%;pointer-events:none;background:var(--cr-landing-art) center right/cover no-repeat;mask-image:linear-gradient(to right,transparent 0%,#000 29%);z-index:0}.welcome-bottom{position:absolute;left:6.3%;bottom:3%;font-size:11px;color:#a6c3ec;letter-spacing:.17em}

function owns(type,id){const target=type==='batch'?state.batches.find(x=>x.id===id):state.ebooks.find(x=>x.id===id);if(!target)return false;if(Number(target.price)===0)return true;if(type==='ebook'&&target.batchId&&owns('batch',target.batchId))return true;return window.CRCloud?.enabledForStudent ? window.CRCloud.hasGrant(type,id) : myPayments().some(p=>p.type===type&&p.itemId===id&&p.status==='approved')}

function fileDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(FILE_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function putFile(id,file){const db=await fileDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file,id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function getFile(id){const db=await fileDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readonly');const q=tx.objectStore('files').get(id);q.onsuccess=()=>{db.close();resolve(q.result)};q.onerror=()=>{db.close();reject(q.error)}})}
async function removeFile(id){const db=await fileDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}

function dateCountdown(date){if(!date)return `<div class="info">Set your target exam date to start your countdown.</div>`;const left=Math.max(0,new Date(`${date}T00:00:00`).getTime()-Date.now());const values=[Math.floor(left/864e5),Math.floor(left/36e5)%24,Math.floor(left/6e4)%60,Math.floor(left/1e3)%60];return `<div class="countdown">${values.map((n,i)=>`<div><b>${String(n).padStart(2,'0')}</b><small>${['DAYS','HOURS','MIN','SEC'][i]}</small></div>`).join('')}</div>`}

let examTick=null, bannerObjectUrl=null;
function stopTimer(){if(examTick){clearInterval(examTick);examTick=null}}
function examKey(id){return `cr-exam-session-${me()?.id||'admin-preview'}-${id}`}
function examStorage(){return ui.activeExam?.kind==='native'?ui.activeExam.session:null}
function saveExam(){const ex=examStorage();if(ex)try{localStorage.setItem(examKey(ex.id),JSON.stringify(ex))}catch{}}
function loadExam(t){let stored=null;try{stored=JSON.parse(localStorage.getItem(examKey(t.id))||'null')}catch{}return stored&&Array.isArray(stored.answers)&&stored.answers.length===sampleQuestions.length?stored:{id:t.id,index:0,answers:Array(sampleQuestions.length).fill(null),review:[],remaining:t.minutes*60,initial:t.minutes*60,startedAt:Date.now()}}
async function startExam(id){const t=state.tests.find(t=>t.id===id);if(!t){notify('Exam not found.','error');return}if(ui.mode==='student'&&!owns('batch',t.batchId)){notify('This batch is locked.','error');return}if(t.kind==='uploaded'){let file=await getFile(t.id).catch(()=>null);if(!file&&ui.mode==='student'&&window.CRCloud?.enabledForStudent){notify('Downloading your authorized exam…');await window.CRCloud.ensureFile('test',id);file=await getFile(t.id)}if(!file){notify('Exam not saved on this device. Ask the admin to publish it.','error');return}}ui.modal=null;ui.activeExam={kind:t.kind,id:t.id,session:t.kind==='native'?loadExam(t):null};ui.paused=false;render();if(t.kind==='native'){saveExam();runTimer()}}
function runTimer(){stopTimer();if(ui.paused||ui.activeExam?.kind!=='native')return;examTick=setInterval(()=>{const ex=examStorage();if(!ex)return;ex.remaining=Math.max(0,ex.remaining-1);saveExam();const clock=$('#clock');if(clock)clock.textContent=timefmt(ex.remaining);if(ex.remaining===0)submitExam(true)},1000)}
function timefmt(s){s=Math.max(0,Math.floor(s));return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function nativeExamUI(){const ex=examStorage(),q=sampleQuestions[ex.index],answered=ex.answers.filter(x=>x!==null&&x!==undefined).length;return `<div class="test-stage"><div class="test-top"><div><b>📝 Civil Engineering — Practice Exam</b><div class="small muted">8 questions · 12 minutes · +1 / −0.25</div></div><div class="actions"><b id="clock" style="font-variant-numeric:tabular-nums;color:#334fe0">⏱ ${timefmt(ex.remaining)}</b>${btn(ui.paused?'▶ Resume':'Ⅱ Pause','pause-exam','line sm')}${btn('Submit','submit-exam','sm')}</div></div><div class="test-body"><div class="test-question"><div class="spread"><span class="pill">QUESTION ${ex.index+1} / ${sampleQuestions.length}</span><span class="pill ${ex.review.includes(ex.index)?'pending':''}">${ex.review.includes(ex.index)?'Marked for review':answered+' answered'}</span></div><h3 style="margin-top:28px">${esc(q.q)}</h3><div style="margin-top:23px">${q.o.map((opt,i)=>`<button class="option ${ex.answers[ex.index]===i?'sel':''}" data-action="answer" data-option="${i}"><span class="opt-letter">${'ABCD'[i]}</span><span>${esc(opt)}</span></button>`).join('')}</div><div class="test-controls">${btn('Clear Response','clear-answer','line sm')}${btn(ex.review.includes(ex.index)?'Unmark Review':'Mark for Review','mark-review','ghost sm')}<div class="actions">${btn('← Previous','prev-question','line sm',ex.index===0?'disabled':'')}${btn(ex.index===sampleQuestions.length-1?'Go to Q1':'Save & Next →','next-question','sm')}</div></div></div><aside class="test-palette"><h3 style="margin:0">Question Palette</h3><p class="small muted" style="margin:10px 0">Jump to any question</p><div class="palette-grid">${sampleQuestions.map((_,i)=>`<button data-action="jump-question" data-index="${i}" class="${ex.answers[i]!==null?'answered':''} ${ex.review.includes(i)?'marked':''} ${ex.index===i?'current':''}">${i+1}</button>`).join('')}</div><div class="list" style="font-size:12px"><div class="spread"><span>🟢 Answered</span><b>${answered}</b></div><div class="spread"><span>🟣 Marked for review</span><b>${ex.review.length}</b></div><div class="spread"><span>⚪ Unanswered</span><b>${sampleQuestions.length-answered}</b></div></div><div class="info warn">Your answers and remaining time autosave in this browser. Closing the tab pauses the practice timer; no cross-device sync.</div>${btn('← Back to Portal','exit-exam','line sm full')}</aside></div>${ui.paused?`<div class="exam-paused"><div><div style="font-size:55px">⏸</div><h1>Exam Paused</h1><p>Your answers and remaining time have been saved.</p>${btn('▶ Resume Test','pause-exam')}</div></div>`:''}</div>`}

 async signInAdmin(username,password){if(!this.ready)throw Error(this.stateText());if(String(username||'').trim()!=='6370641835')throw Error('Invalid administrator credentials');if(!password)throw Error('Enter your administrator password');let credential;try{credential=await modules.signInWithEmailAndPassword(baseAuth,ADMIN_EMAIL,password)}catch(err){const c=String(err?.code||'');if(['auth/invalid-credential','auth/invalid-login-credentials','auth/wrong-password','auth/user-not-found'].includes(c))throw Error('Firebase rejected the admin sign-in. Confirm the administrator account was provisioned in Firebase project ossc-5388f and that you entered its current password. The HTML cannot create/reset an admin account. See Firebase Setup → README.md.');if(c==='auth/operation-not-allowed')throw Error('Enable Email/Password in Firebase Console → Authentication → Sign-in method.');if(c==='auth/too-many-requests')throw Error('Firebase has temporarily blocked repeated login attempts. Wait before trying again; do not keep guessing passwords.');if(c==='auth/network-request-failed')throw Error('Unable to reach Firebase Authentication. Check your internet connection and hosting domain.');throw err}const token=await modules.getIdTokenResult(credential.user,true);if(token.claims.admin!==true){await modules.signOut(baseAuth);throw Error('Account is not authorized as an administrator. Contact the project owner.')}if(token.claims.mustChangePassword===true){claimAdmin=false;ui.modal={type:'admin-rotate'};render();return}activeApp=baseApp;activeAuth=baseAuth;activeDb=baseDb;activeStore=modules.getStorage(baseApp);activeFunctions=modules.getFunctions(baseApp);activeProjectId=PRIMARY_CONFIG.projectId;this.projectId=activeProjectId;claimAdmin=true;this.enabledForStudent=false;ui.mode='admin';ui.adminTab='overview';ui.modal=null;await this.loadProjects();await this.loadAdminData();render();notify('Administrator authenticated securely.');},
 async rotateAdminPassword(newPassword){if(!this.ready||!baseAuth?.currentUser)throw Error('Sign in again first');if(typeof newPassword!=='string'||newPassword.length<14||newPassword.length>120||!/[A-Z]/.test(newPassword)||!/[a-z]/.test(newPassword)||!/[0-9]/.test(newPassword)||!/[^A-Za-z0-9]/.test(newPassword))throw Error('Choose 14–120 characters with uppercase, lowercase, number and symbol');const rotate=modules.httpsCallable(modules.getFunctions(baseApp),'completeAdminPasswordRotation');await rotate({newPassword});await modules.signOut(baseAuth).catch(()=>{});claimAdmin=false;ui.mode='welcome';ui.modal={type:'admin-login'};render();notify('Password changed. Sign in once more with your new administrator password.');},
 async requestStudentOtp(form){if(!this.ready)throw Error(this.stateText());if(!/^\d{10}$/.test(String(form.phone||'').trim()))throw Error('Enter a valid 10-digit Indian mobile number.');if(!String(form.name||'').trim()||!form.dob||!form.gender)throw Error('Enter full name, date of birth and gender for registration, or fill them to sign in.');this.pendingProfile={phone:String(form.phone).trim(),name:String(form.name).trim().slice(0,90),dob:form.dob,gender:form.gender,category:form.category||'UR'};
 if(activeAuth!==baseAuth){activeApp=baseApp;activeAuth=baseAuth;activeDb=baseDb;activeStore=modules.getStorage(baseApp);activeFunctions=modules.getFunctions(baseApp);activeProjectId=PRIMARY_CONFIG.projectId;claimAdmin=false}
 if(baseAuth.currentUser&&!(await modules.getIdTokenResult(baseAuth.currentUser)).claims.admin){await modules.signOut(baseAuth)}

 async verifyStudentOtp(code){if(!challenge)throw Error('Request a new verification code first');if(!/^\d{6}$/.test(String(code).trim()))throw Error('Enter the 6-digit SMS code.');let verified;try{verified=await challenge.confirm(String(code).trim())}catch(err){const c=String(err?.code||'');if(['auth/invalid-credential','auth/invalid-verification-code','auth/code-expired','auth/session-expired'].includes(c))throw Error('The SMS verification code is invalid or has expired. Check the code and request a new OTP if needed.');throw err}challenge=null;const user=verified.user;const tok=await modules.getIdTokenResult(user,true);if(tok.claims.admin)throw Error('Administrator accounts cannot register as students');await this.restoreStudent(user,this.pendingProfile);ui.modal=null;ui.mode='student';ui.studentTab='home';render();postBannerImage();notify('Mobile number verified. Welcome to Civil Rankers.');},
 async restoreStudent(user,registration=null){if(!activeDb||!user)return;const snap=await modules.get(modules.ref(activeDb,'profiles/'+user.uid));let profile=snap.exists()?snap.val():null;
 if(!profile){if(!registration||!registration.name)return;profile={uid:user.uid,name:registration.name,phone:registration.phone,dob:registration.dob||'',gender:registration.gender||'',category:registration.category||'UR',createdAt:Date.now()};await modules.set(modules.ref(activeDb,'profiles/'+user.uid),profile)}

 async ensureFile(type,id){if(!this.enabledForStudent&&!this.isAdmin())throw Error('Sign in with a verified account');const t=type==='test'?state.tests.find(x=>x.id===id):type==='ebook'?state.ebooks.find(x=>x.id===id):state.banners.find(x=>x.id===id);if(!t?.storagePath)throw Error('This file is only available on the device that imported it. Ask the admin to publish it online.');if(this.isAdmin()){const data=await modules.getBlob(modules.storageRef(activeStore,t.storagePath));await putFile(id,data);return true}const call=modules.httpsCallable(activeFunctions,'getLearningFile');const result=await call({type,id});const signed=result.data?.url;if(!signed||!signed.startsWith('https://'))throw Error('Secure download unavailable');const resp=await fetch(signed,{cache:'no-store'});if(!resp.ok)throw Error('Download failed: '+resp.status);await putFile(id,await resp.blob());return true;},
 async updateProfile(profile){if(!this.enabledForStudent||activeAuth.currentUser?.uid!==profile.id)throw Error('Student authentication required');const data={uid:profile.id,name:profile.name,phone:profile.phone,dob:profile.dob,gender:profile.gender,category:profile.category,createdAt:profile.createdAt||Date.now()};await modules.set(modules.ref(activeDb,'profiles/'+profile.id),data)},

 async reviewPayment(id,approve){if(!this.isAdmin())throw Error('Admin required');const p=state.payments.find(p=>p.id===id);if(!p)return;const ref=modules.ref(activeDb,'paymentRequests/'+id);const latest=await modules.get(ref);if(!latest.exists())throw Error('Payment reference is not on Firebase; cannot approve securely');const data=latest.val();if(data.status!=='pending')throw Error('Already reviewed');await modules.update(ref,{status:approve?'approved':'rejected',reviewedAt:Date.now(),reviewedBy:activeAuth.currentUser.uid});if(approve)await modules.set(modules.ref(activeDb,`grants/${data.studentId}/${data.type}_${data.itemId}`),true);},
